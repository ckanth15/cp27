<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><title>404 — Page Not Found</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f5f7fa;color:#333;font-size:13px;height:100vh;overflow:hidden}
.fake404{display:flex;justify-content:center;align-items:center;height:100vh;background:#fff;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.fake404 h1{font-size:48px;color:#24292f;margin-bottom:8px}.fake404 p{color:#57606a;font-size:16px;margin-bottom:16px}
.fake404 a{color:#0969da;text-decoration:none;font-size:14px;cursor:pointer}
#passBox{display:none;margin-top:16px}
#passBox input{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;width:200px}
#passBox button{padding:6px 12px;border:none;background:#0969da;color:#fff;border-radius:4px;font-size:13px;cursor:pointer;margin-left:4px}
#passErr{color:#cf222e;font-size:12px;margin-top:6px;display:none}
.app{display:none}
.bar{background:linear-gradient(135deg,#1a5490,#0d3a6e);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
.bar h1{font-size:14px}.bar a{color:#8bb8e8;font-size:10px;text-decoration:none;border:1px solid #8bb8e8;padding:2px 8px;border-radius:3px;margin-left:4px}.bar a:hover{background:#fff;color:#1a5490}
.ticker{background:#0d3a6e;padding:4px 10px;display:flex;gap:6px;overflow-x:auto;align-items:center;min-height:28px;flex-wrap:nowrap}
.ticker-label{color:#8bb8e8;font-size:9px;font-weight:bold;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.chip{background:rgba(255,255,255,.15);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.2);display:inline-flex;align-items:center;gap:3px}
.chip:hover{background:rgba(255,255,255,.3)}
.chip-deadline{border-color:#ff6b6b;background:rgba(255,107,107,.25)}
.chip-urgent{border-color:#ff0;background:rgba(255,255,0,.2);color:#ff0;animation:pulse 1.5s infinite}
.chip-pin{border-color:#4caf50;background:rgba(76,175,80,.2)}
.chip .x{opacity:.5;margin-left:2px;cursor:pointer}.chip .x:hover{opacity:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.wrap{display:flex;height:calc(100vh - 62px)}
.left{width:300px;min-width:260px;border-right:none;display:flex;flex-direction:column;background:#1e293b;color:#e2e8f0}
.right{flex:1;overflow-y:auto;padding:16px 20px;background:#f8fafc}
.search{padding:6px;border-bottom:1px solid #334155;background:#162032}
.search input{width:100%;padding:5px 7px;border:1px solid #475569;border-radius:4px;font-size:11px;background:#1e293b;color:#e2e8f0}
.search input::placeholder{color:#64748b}
.cbox{padding:6px;border-bottom:1px solid #334155;background:#162032}
.cbox textarea{width:100%;height:50px;padding:5px;border:1px solid #475569;border-radius:4px;font-size:10px;font-family:monospace;resize:vertical;background:#1e293b;color:#e2e8f0}
.cbox textarea::placeholder{color:#64748b}
.cbox button{margin-top:3px;padding:3px 8px;background:#3b82f6;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px}
.cbox button:hover{background:#2563eb}
.sections{overflow-y:auto;flex:1}
.sec-head{padding:6px 10px;background:#334155;font-weight:bold;color:#93c5fd;font-size:10px;text-transform:uppercase;border-bottom:1px solid #475569;position:sticky;top:0;z-index:5;cursor:pointer;display:flex;justify-content:space-between;align-items:center;letter-spacing:.5px;user-select:none}
.sec-head:hover{background:#3b4f6b}
.sec-head .arrow{font-size:8px;transition:transform .2s}
.sec-head .arrow.collapsed{transform:rotate(-90deg)}
.sec-items{overflow:hidden;transition:max-height .3s ease}
.sec-items.collapsed{max-height:0!important}
.item{padding:6px 10px;border-bottom:1px solid #2d3a4e;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#cbd5e1}
.item:hover{background:#2d3a4e}.item.active{background:#1e40af;border-left:3px solid #60a5fa;color:#fff}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600}
.b-s{background:#166534;color:#bbf7d0}.b-m{background:#854d0e;color:#fef08a}.b-r{background:#991b1b;color:#fecaca}
.mt{background:#166534;color:#bbf7d0;font-size:9px;padding:0 4px;border-radius:2px;margin-left:3px}
.pin-btn{cursor:pointer;font-size:14px;opacity:.4;margin-left:4px}.pin-btn:hover{opacity:1}.pin-btn.pinned{opacity:1}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{color:#1a5490;font-size:16px;margin-bottom:8px;border-bottom:2px solid #e8f0fe;padding-bottom:6px;letter-spacing:-.3px}
.card h3{color:#1a5490;font-size:13px;margin:12px 0 6px;font-weight:600;letter-spacing:-.2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:3px 0}
.field{flex:1;min-width:120px}.field label{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.5px;font-weight:600}.field p{font-size:13px;margin-top:2px;font-weight:500}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{color:#0563C1;text-decoration:none;font-size:12px}.link:hover{text-decoration:underline}
.loading{text-align:center;padding:40px;color:#888}
@media(max-width:768px){.wrap{flex-direction:column}.left{width:100%;height:40vh;min-width:auto}.right{height:60vh}}
</style></head><body>

<div class="fake404" id="wall">
<svg height="54" viewBox="0 0 24 24" width="54"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#24292f"/></svg>
<h1>404</h1>
<p>There isn't a GitHub Pages site here.</p>
<a onclick="document.getElementById('passBox').style.display='block';document.getElementById('passInput').focus();">Read the full documentation →</a>
<div id="passBox"><div><input type="password" id="passInput" placeholder="do you magic" onkeydown="if(event.key==='Enter')tryPass()"><button onclick="tryPass()">→</button></div><div id="passErr">Invalid code</div></div>
</div>

<div class="app" id="app">
<div class="bar">
<h1>College Planner 2027</h1>
<div><a href="https://docs.google.com/spreadsheets/d/1jXBB6CA8eVNcbR2mwu2xPWCdlo_lNjWfJNyGVO3io2c/edit" target="_blank">📊 Sheet</a>
<a href="#" onclick="loadData();return false">🔄</a>
<a href="#" onclick="lockOut();return false">🔒</a></div>
</div>
<div class="ticker" id="ticker"></div>
<div class="wrap">
<div class="left">
<div class="cbox">
<div style="font-weight:bold;font-size:10px;color:#93c5fd;margin-bottom:2px">📋 Paste counselor list:</div>
<textarea id="cIn" placeholder="Purdue&#10;Penn State&#10;Georgia Tech..."></textarea>
<button onclick="compare()">Compare</button>
<span id="cSt" style="font-size:9px;margin-left:4px;color:#666"></span>
</div>
<div class="search"><input type="text" id="sb" placeholder="🔍 Search..." oninput="filter()"></div>
<div class="sections" id="list"><div class="loading">Loading...</div></div>
</div>
<div class="right" id="rp"><div class="card"><h2>Loading...</h2></div></div>
</div>
</div>

<script>
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTwNjVt3WufADla3dVggZr1uF06VmGsGqGBKxVP9n1uy3DeQ7vlOqPM9yWiQKNb6UU69DXHH77Dg_Hk/pub?output=csv';
const MAGIC='RisB0b2027';const TOKEN='6I9maYMnoFhq8WVXkmjKIQ';const AUTH_KEY='_cp27x';const PIN_KEY='_cp27pins';
let DB=[],cSet=new Set(),activeI=-1,pins=new Set();

function isAuthed(){try{const v=localStorage.getItem(AUTH_KEY);if(!v)return false;return Date.now()<parseInt(v);}catch(e){return false;}}
function setAuth(){try{localStorage.setItem(AUTH_KEY,String(Date.now()+90*24*60*60*1000));}catch(e){}}
function clearAuth(){try{localStorage.removeItem(AUTH_KEY);}catch(e){}}
function loadPins(){try{const v=localStorage.getItem(PIN_KEY);if(v)pins=new Set(JSON.parse(v));}catch(e){}}
function savePins(){try{localStorage.setItem(PIN_KEY,JSON.stringify([...pins]));}catch(e){}}
function togglePin(name){if(pins.has(name))pins.delete(name);else pins.add(name);savePins();buildTicker();buildList();if(activeI>=0)show(activeI);}

if(isAuthed()){loadPins();unlock();}

function tryPass(){
const v=document.getElementById('passInput').value;
if(v===MAGIC){setAuth();loadPins();location.hash=TOKEN;unlock();}
else{document.getElementById('passErr').style.display='block';document.getElementById('passInput').value='';setTimeout(()=>{document.getElementById('passErr').style.display='none';},2000);}
}
function unlock(){document.getElementById('wall').style.display='none';document.getElementById('app').style.display='block';document.title='College Planner 2027';location.hash=TOKEN;loadData();}
function lockOut(){clearAuth();document.getElementById('app').style.display='none';document.getElementById('wall').style.display='flex';document.getElementById('passBox').style.display='none';document.title='404 — Page Not Found';location.hash='';}

function parseDeadline(dl){
if(!dl||dl==='—'||dl==='Rolling')return null;
const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const m=dl.toLowerCase().match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*\s+(\d+)/);
if(!m)return null;
const yr=dl.includes('2027')?2027:2026;
return new Date(yr,months[m[1]],parseInt(m[2]));
}

function buildTicker(){
const now=new Date();
let deadlines=DB.map((s,i)=>({...s,i,date:parseDeadline(s.ad)}))
.filter(s=>s.date&&s.date>now)
.sort((a,b)=>a.date-b.date)
.slice(0,8);
let h='';
if(deadlines.length){
h+='<span class="ticker-label">⏰ Deadlines:</span>';
deadlines.forEach(s=>{
const days=Math.ceil((s.date-now)/(1000*60*60*24));
const cls=days<=30?'chip-urgent':days<=90?'chip-deadline':'chip';
h+=`<span class="${cls}" onclick="show(${s.i})">${s.n.split(' ')[0]} ${s.ad} (${days}d)</span>`;
});
}
if(pins.size){
h+='<span class="ticker-label" style="margin-left:8px">📌 Pinned:</span>';
DB.forEach((s,i)=>{if(pins.has(s.n))h+=`<span class="chip chip-pin" onclick="show(${i})">${s.n.split(' ').slice(0,2).join(' ')}<span class="x" onclick="event.stopPropagation();togglePin('${s.n.replace(/'/g,"\\'")}')">✕</span></span>`;});
}
if(!h)h='<span class="ticker-label">📌 Click the pin icon on any school to add it here for quick access</span>';
document.getElementById('ticker').innerHTML=h;
}

function parseCSV(t){const rows=[];let cur='',inQ=false,row=[],i=0;while(i<t.length){const c=t[i];if(c==='"'){if(inQ&&t[i+1]==='"'){cur+='"';i+=2;}else{inQ=!inQ;i++;}}else if(c===','&&!inQ){row.push(cur.trim());cur='';i++;}else if((c==='\n'||c==='\r')&&!inQ){row.push(cur.trim());if(row.length>1)rows.push(row);row=[];cur='';if(c==='\r'&&t[i+1]==='\n')i++;i++;}else{cur+=c;i++;}}if(cur||row.length){row.push(cur.trim());if(row.length>1)rows.push(row);}return rows;}

function loadData(){
document.getElementById('list').innerHTML='<div class="loading">Loading...</div>';
fetch(SHEET_CSV+'&_t='+Date.now()).then(r=>r.text()).then(t=>{
const rows=parseCSV(t);DB=[];
for(let i=1;i<rows.length;i++){const r=rows[i];if(r.length<10)continue;
DB.push({n:r[0],s:r[1],cat:r[2],ch:r[3],cy:r[4],nsa:r[5],w:r[6],cr:r[7],co:r[8],h4:r[9],
css:r[10],me:r[11],ao:r[12],ad:r[13],dt:r[14],dr:r[15],af:r[16],
applied:r[17]||'—',essay:r[18]||'—',supp:r[19]||'—',trans:r[20]||'—',recs:r[21]||'—',decision:r[22]||'—',
comments:r[23]||'',url:r[24]||'',g:r[25]||''});}
buildList();buildTicker();showWelcome();
}).catch(e=>{document.getElementById('list').innerHTML='<div class="loading" style="color:red">Failed to load. Publish sheet as CSV first.</div>';});
}

const AL={"rit":"RIT","drexel":"Drexel","george mason":"George Mason","gmu":"George Mason","south florida":"South Florida","usf":"South Florida","northeastern":"Northeastern","penn state":"Penn State","texas a&m":"Texas A&M","tamu":"Texas A&M","cal poly pomona":"Cal Poly Pomona","cal poly slo":"Cal Poly SLO","cal poly":"Cal Poly SLO","cal state fullerton":"Cal State Fullerton","sjsu":"San Jose State","cal state long":"Cal State Long","uc santa cruz":"UC Santa Cruz","uc riverside":"UC Riverside","ut dallas":"UT Dallas","utd":"UT Dallas","oregon tech":"Oregon Tech","university of georgia":"University of Georgia","uga":"University of Georgia","georgia southern":"Georgia Southern","georgia tech":"Georgia Tech","gatech":"Georgia Tech","toronto":"Toronto","washington":"Washington","purdue":"Purdue","texas tech":"Texas Tech","santa clara":"Santa Clara","utsa":"UT San Antonio","kennesaw":"Kennesaw","ut austin":"UT Austin","ucf":"Central Florida","fsu":"Florida State","fiu":"Florida Intl","nc state":"NC State","virginia tech":"Virginia Tech","asu":"Arizona State","birmingham":"Birmingham","warwick":"Warwick","kings college":"King's College","king's":"King's College"};
function ms(input){const l=input.toLowerCase().trim();if(!l)return[];for(const[k,v]of Object.entries(AL)){if(l.includes(k))return DB.filter(s=>s.n.toLowerCase().includes(v.toLowerCase()));}return DB.filter(s=>s.n.toLowerCase().includes(l));}
function bc(c){return c==="Safety"?"b-s":c==="Match"?"b-m":"b-r"}

function showWelcome(){
document.getElementById('rp').innerHTML=`<div class="card"><h2>👆 Click any school on the left</h2>
<div class="grid2">
<div class="card" style="margin:0"><h3>Profile</h3><p>Lynbrook HS | <br>SJ, CA → Alpharetta, GA</p></div>
<div class="card" style="margin:0"><h3>Aid</h3><p>❌ FAFSA | ✅ CSS (5 schools)<br>✅ Auto-merit: ASU, UA, UTD<br>✅ Loans: MPOWER (no cosigner)</p></div>
</div>
<p style="margin-top:8px;font-size:11px;color:#666">📊 Data from <a href="https://docs.google.com/spreadsheets/d/1jXBB6CA8eVNcbR2mwu2xPWCdlo_lNjWfJNyGVO3io2c/edit" target="_blank" class="link">Google Sheet</a>. <b>${DB.length} schools loaded.</b><br>
📌 Pin your favorite schools — they appear in the top bar for quick jump.<br>
⏰ Approaching deadlines auto-show in the top bar (yellow = urgent).</p></div>`;
}

function show(i){
activeI=i;const s=DB[i];
document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
const el=document.querySelector(`[data-i="${i}"]`);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
const ic=cSet.has(s.n);const isPinned=pins.has(s.n);
const pinIcon=isPinned?'📌':'📍';const pinLabel=isPinned?'Unpin':'Pin';
const safeN=s.n.replace(/'/g,"\\'");
document.getElementById('rp').innerHTML=`
<div class="card"><h2><a href="${s.url}" target="_blank" class="link">${s.n}</a> ${ic?'<span class="mt">✓ Counselor</span>':''} <span class="badge ${bc(s.cat)}">${s.cat} ${s.ch}</span>
<span class="pin-btn ${isPinned?'pinned':''}" onclick="togglePin('${safeN}')" title="${pinLabel}">${pinIcon}</span></h2>
<div class="grid3">
<div class="field"><label>Cost/yr (F-1)</label><p><b>${s.co}</b></p></div>
${s.h4?`<div class="field"><label>H-4 Waiver</label><p style="color:#2E7D32;font-weight:bold">${s.h4}/yr</p></div>`:''}
<div class="field"><label>App Fee</label><p>${s.af}</p></div>
</div>
<div class="row"><div class="field"><label>Cyber Program</label><p>${s.cy}</p></div><div class="field"><label>NSA/CAE</label><p>${s.nsa}</p></div></div>
<div class="row"><div class="field"><label>Weather</label><p>${s.w}</p></div><div class="field"><label>Crime</label><p>${s.cr}</p></div>
<div class="field"><label>CSS?</label><p>${s.css.includes('Yes')?'✅ '+s.css:'❌ No'}</p></div><div class="field"><label>Merit</label><p>${s.me}</p></div></div></div>
<div class="card"><h3>📅 Timeline</h3>
<div class="grid3"><div class="field"><label>Opens</label><p>${s.ao||'—'}</p></div><div class="field"><label>Deadline</label><p><b>${s.ad}</b></p></div>
<div class="field"><label>Type</label><p>${s.dt}</p></div><div class="field"><label>Decision</label><p>${s.dr}</p></div>
<div class="field"><label>Website</label><p><a href="${s.url}" target="_blank" class="link">Visit →</a></p></div></div></div>
<div class="card"><h3>📝 Tracking</h3>
<div class="grid3">
<div class="field"><label>Applied</label><p><b>${s.applied}</b></p></div>
<div class="field"><label>Common App Essay</label><p>${s.essay}</p></div>
<div class="field"><label>Supplemental</label><p>${s.supp}</p></div>
<div class="field"><label>Transcripts</label><p>${s.trans}</p></div>
<div class="field"><label>Recs</label><p>${s.recs}</p></div>
<div class="field"><label>Decision</label><p>${s.decision}</p></div>
</div>
<p style="font-size:10px;color:#888;margin-top:6px">✏️ Edit in <a href="https://docs.google.com/spreadsheets/d/1jXBB6CA8eVNcbR2mwu2xPWCdlo_lNjWfJNyGVO3io2c/edit" target="_blank" class="link">Google Sheet</a> → 🔄 Refresh</p></div>
${s.comments?`<div class="card"><h3>💬 Comments</h3><p>${s.comments}</p></div>`:''}`;
}

let collapsed={};
function toggleSec(id){collapsed[id]=!collapsed[id];buildList();}
function buildList(){
const groups=[{l:'🏠 Georgia',id:'ga',f:s=>s.g==='Georgia'},{l:'🇺🇸 California',id:'ca',f:s=>s.g==='California'},{l:'🇺🇸 Texas',id:'tx',f:s=>s.g==='Texas'},{l:'🇺🇸 Florida',id:'fl',f:s=>s.g==='Florida'},{l:'🇺🇸 Other US',id:'ous',f:s=>s.g==='Other US'},{l:'🇺🇸 Private (CSS)',id:'css',f:s=>s.g==='Private CSS'},{l:'🌍 International',id:'intl',f:s=>s.g==='International'}];
let h='';
groups.forEach(g=>{const sc=DB.map((s,i)=>({...s,i})).filter(g.f);if(!sc.length)return;
const isC=collapsed[g.id];
h+=`<div class="sec-head" onclick="toggleSec('${g.id}')">${g.l} (${sc.length})<span class="arrow ${isC?'collapsed':''}">▼</span></div>`;
h+=`<div class="sec-items ${isC?'collapsed':''}" style="max-height:${isC?'0':'9999'}px">`;
sc.forEach(s=>{const ic=cSet.has(s.n);const ip=pins.has(s.n);
h+=`<div class="item${activeI===s.i?' active':''}" data-i="${s.i}" data-nm="${s.n.toLowerCase()}" onclick="show(${s.i})">
<div style="flex:1"><b style="font-size:11px">${ip?'📌 ':''}${s.n}</b>${ic?'<span class="mt">✓</span>':''}</div>
<div style="text-align:right"><div style="font-weight:bold;color:#60a5fa;font-size:10px">${s.co}</div><span class="badge ${bc(s.cat)}">${s.cat}</span></div></div>`;
});
h+=`</div>`;
});
document.getElementById('list').innerHTML=h||'<div class="loading">No data.</div>';
}

function filter(){const q=document.getElementById('sb').value.toLowerCase();document.querySelectorAll('.item').forEach(e=>{e.style.display=e.dataset.nm.includes(q)?'':'none';});}
function compare(){const input=document.getElementById('cIn').value;const lines=input.split('\n').map(l=>l.replace(/^\d+\.?\s*/,'').replace(/\{.*?\}/g,'').trim()).filter(l=>l&&!/^tier\s*\d/i.test(l));cSet=new Set();lines.forEach(l=>{ms(l).forEach(s=>cSet.add(s.n));});document.getElementById('cSt').innerHTML=`✓${cSet.size} matched`;buildList();}
</script></body></html>
